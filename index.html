<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="boot">
    <div id="logo">🖥️</div>
    <h1>NovaOS</h1>
    <div class="loader"></div>
</div>
<div id="login">
    ...
</div>

<div id="login">
    <form>
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Submit</button>
    </form>
</div>

<div id="desktop">


    <div class="icon" onclick="openApp('files')">
        <div class="emoji">📁</div>
        <span>Files</span>
    </div>

    <div class="icon" onclick="openApp('browser')">
        <div class="emoji">🌐</div>
        <span>Browser</span>
    </div>

    <div class="icon" onclick="openApp('settings')">
        <div class="emoji">⚙️</div>
        <span>Settings</span>
    </div>


    <!-- Apps -->

    <div class="window" id="files">
        <div class="titlebar">
            File Explorer
            <button onclick="closeApp('files')">✖</button>
        </div>

        <p>📄 Welcome.txt</p>
        <p>📁 Games</p>
        <p>🖼 Photos</p>
    </div>


    <div class="window" id="browser">
        <div class="titlebar">
            Nova Browser
            <button onclick="closeApp('browser')">✖</button>
        </div>

        <h2>🌐 Nova Browser</h2>
        <input placeholder="Search the web...">
    </div>


    <div class="window" id="settings">
        <div class="titlebar">
            Settings
            <button onclick="closeApp('settings')">✖</button>
        </div>

        <button onclick="changeWallpaper()">Change Wallpaper</button>
    </div>


</div>


<div id="taskbar">

    <button id="start">
        ⊞ Start
    </button>

    <span id="clock"></span>

</div>


<script src="script.js"></script>

</body>
</html>
