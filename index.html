<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="boot">
    <div id="logo">🖥️</div>
    <h1>NovaOS</h1>
    <div class="loader"></div>
</div>


<div id="login">

    <div class="login-box">

        <h2>🔐 NovaOS Login</h2>

        <form onsubmit="login(event)">

            <label>Username:</label>
            <input type="text" id="username" required>

            <label>Password:</label>
            <input type="password" id="password" required>

            <button type="submit">
                Sign In
            </button>

            <p id="error"></p>

        </form>

    </div>

</div>



<div id="desktop">


    <div class="icon" onclick="openApp('files')">
        <div class="emoji">📁</div>
        <span>Files</span>
    </div>


    <div class="icon" onclick="openApp('browser')">
        <div class="emoji">🌐</div>
        <span>Browser</span>
    </div>


    <div class="icon" onclick="openApp('settings')">
        <div class="emoji">⚙️</div>
        <span>Settings</span>
    </div>



    <!-- WINDOWS -->


    <div class="window" id="files">

        <div class="titlebar">
            File Explorer
            <button onclick="closeApp('files')">✖</button>
        </div>

        <p>📄 Welcome.txt</p>
        <p>📁 Games</p>
        <p>🖼 Photos</p>

    </div>



    <div class="window" id="browser">

        <div class="titlebar">
            Nova Browser
            <button onclick="closeApp('browser')">✖</button>
        </div>

        <h2>🌐 Nova Browser</h2>

        <input placeholder="Search the web...">

    </div>




    <div class="window" id="settings">

        <div class="titlebar">
            Settings
            <button onclick="closeApp('settings')">✖</button>
        </div>

        <button onclick="changeWallpaper()">
            Change Wallpaper
        </button>

    </div>




    <!-- MACOS DOCK -->

    <div id="dock">

        <div class="dock-icon" onclick="openApp('files')">
            📁
        </div>


        <div class="dock-icon" onclick="openApp('browser')">
            🌐
        </div>


        <div class="dock-icon" onclick="openApp('settings')">
            ⚙️
        </div>


        <div class="dock-line"></div>


        <div class="dock-icon">
            🗑️
        </div>

    </div>



</div>



<script src="script.js"></script>

</body>
</html>
